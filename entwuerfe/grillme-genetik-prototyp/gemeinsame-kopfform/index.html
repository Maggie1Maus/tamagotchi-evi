<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamagotchi · Kreuzungen ausprobieren</title>
  <style>
    :root { color-scheme: light; color: #232323; background: #eeedeb; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 860px; margin: 32px auto; padding: 0 18px; }
    h1 { font-size: clamp(1.65rem, 4vw, 2.25rem); line-height: 1.1; margin: 0 0 8px; }
    p { margin: 0; }
    .hinweis { color: #515151; }
    fieldset { border: 1px solid #ccc; border-radius: 10px; background: #fafafa; margin: 24px 0 18px; padding: 12px 16px 16px; }
    legend, label { font-weight: 600; }
    .merkmale, .tasten { display: flex; flex-wrap: wrap; gap: 10px; }
    .merkmale > div { flex: 1 1 110px; min-width: 0; }
    label { display: block; margin-bottom: 3px; font-size: .88rem; }
    button, select { font: inherit; color: inherit; background: white; border: 1px solid #8a8a8a; border-radius: 5px; padding: 6px 10px; }
    select { width: 100%; }
    button { cursor: pointer; }
    button:first-child { background: #303030; border-color: #303030; color: #fff; }
    .tasten { margin-top: 12px; }
    #tafel { display: grid; grid-template-columns: minmax(72px, .65fr) repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; }
    .titel { text-align: center; font-weight: 650; }
    .phase { font-size: .87rem; font-weight: 650; }
    .bild { display: grid; place-items: center; min-width: 0; background: #fff; border: 1px solid #dadada; border-radius: 8px; }
    .kind { border-color: #717171; }
    canvas { display: block; width: 100%; max-width: 170px; height: auto; image-rendering: pixelated; }
    #herkunft { margin-top: 12px; font-size: .89rem; }
    @media (max-width: 450px) {
      body { padding: 0 10px; margin-top: 18px; }
      #tafel { grid-template-columns: 72px repeat(3, minmax(0, 1fr)); gap: 3px; }
      .titel { font-size: .85rem; }
    }
  </style>
  <script defer src="sprites.js"></script>
  <script defer src="vorschau.js"></script>
</head>
<body>
  <h1>Kreuzungen ausprobieren</h1>
  <p class="hinweis">Mohn und Flocke teilen dieselbe Kopfform. Wähle, welches Elternteil dem Kind jedes Merkmal vererbt.</p>
  <fieldset>
    <legend>Merkmale des Kindes</legend>
    <div class="merkmale" id="merkmale"></div>
    <div class="tasten">
      <button type="button" id="zufall">Zufällig mischen</button>
      <button type="button" id="umkehren">Elternteile tauschen</button>
    </div>
  </fieldset>
  <div id="tafel" aria-label="Eltern und Kind als Baby und erwachsen"></div>
  <p id="herkunft" class="hinweis" role="status"></p>
  <noscript>Zum Kombinieren bitte JavaScript im Browser aktivieren.</noscript>
</body>
</html>
