<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tamagotchi Generator</title>
<style>
:root{--bg:#f6f4f0;--fg:#222;--card:#fff;--line:#d8d3ca;--acc:#6b4fbb}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b1a;--fg:#eee;--card:#2a2725;--line:#47423e;--acc:#a78bfa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}p.s{margin:0 0 14px;opacity:.7}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font-size:.85rem;opacity:.75;margin:10px 0 2px}
select,button{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{cursor:pointer;background:var(--acc);color:#fff;border:0;margin-top:10px}button.z{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bild{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
canvas{background:#fff;border:1px solid var(--line);border-radius:8px;max-width:100%}
#pix{image-rendering:pixelated;width:342px;height:348px}
.herk{font-size:.85rem;margin-top:8px;min-height:2.6em}.herk b{color:var(--acc)}
small{opacity:.7}
</style></head><body><main>

const RANG={schwanz:0,ohr:1,koerper:2,'muster-koerper':3,kopf:4,'muster-gesicht':5,halsschmuck:6,gesicht:7};
const $=i=>document.getElementById(i);const bilder={};
let wahl={},herkunft={};
const stufen=Object.keys(DATEN);
function D(){return DATEN[$('stufe').value][$('ansicht').value]}
function bild(t){if(!bilder[t.bild]){const i=new Image();i.src=t.bild;bilder[t.bild]=i}return bilder[t.bild]}
function ursprung(t){return Object.entries(D().tamagotchis).filter(([n,r])=>r[t.slot]===t.datei).map(([n])=>n)}
function opt(sel,items,keine){sel.innerHTML='';if(keine){const o=document.createElement('option');o.value='';o.textContent='– keins –';sel.appendChild(o)}
 items.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o)})}
function fuelleAnsichten(){opt($('ansicht'),Object.keys(DATEN[$('stufe').value]).map(a=>[a,a]));fuelleAlles()}
function fuelleAlles(){
 const d=D(),tm=Object.keys(d.tamagotchis);
 opt($('e1'),tm.map(n=>[n,n]));opt($('e2'),tm.map(n=>[n,n]));if(tm[1])$('e2').value=tm[1];
 const box=$('slots');box.innerHTML='';
 SLOTS.forEach(([s,l])=>{const items=d.teile.filter(t=>t.slot===s);
  box.insertAdjacentHTML('beforeend',`<label>${l}</label><select data-s="${s}"></select>`);
  const sel=box.lastElementChild;opt(sel,items.map(t=>[t.datei,t.name+(ursprung(t).length?'  ('+ursprung(t).join(', ')+')':'')]),s.startsWith('muster'));
  if(!items.length){sel.disabled=true}sel.onchange=()=>{wahl[s]=sel.value;herkunft={};zeichne()}});
 box.insertAdjacentHTML('beforeend',`<label>Stimmung (Gesicht)</label><select data-s="gesicht"></select>`);
 const g=box.lastElementChild;opt(g,d.teile.filter(t=>t.slot==='gesicht').map(t=>[t.datei,t.name.replace('gesicht-','')]));g.onchange=()=>{wahl.gesicht=g.value;zeichne()};
 wahl={};if(tm.length){laden(tm[0])}else{SLOTS.forEach(([s])=>{const f=d.teile.find(t=>t.slot===s);wahl[s]=f?f.datei:''});zeichne()}
}
function laden(name){const r=D().tamagotchis[name]||{};wahl={...wahl};SLOTS.forEach(([s])=>wahl[s]=r[s]||'');wahl.gesicht=wahl.gesicht||r.gesicht||'';herkunft={};
 const g=document.querySelector('[data-s=gesicht]');if(!wahl.gesicht||!D().teile.find(t=>t.datei===wahl.gesicht&&t.slot==='gesicht')){const f=D().teile.find(t=>t.slot==='gesicht');wahl.gesicht=f?f.datei:''}zeichne()}
function wuerfeln(){const d=D(),A=d.tamagotchis[$('e1').value]||{},B=d.tamagotchis[$('e2').value]||{};herkunft={};
 SLOTS.forEach(([s,l])=>{const von=Math.random()<.5?$('e1').value:$('e2').value;let v=(von===$('e1').value?A:B)[s]||'';let w=von;
  if(Math.random()<.06){const alle=d.teile.filter(t=>t.slot===s);if(alle.length){v=alle[Math.floor(Math.random()*alle.length)].datei;w='Zufall'}}
  wahl[s]=v;herkunft[s]=w});zeichne()}
function reihe(){const d=D(),l=[];[...SLOTS.map(x=>x[0]),'gesicht'].forEach(s=>{const t=d.teile.find(t=>t.slot===s&&t.datei===wahl[s]);if(t)l.push(t)});
 const o=a=>RANG[a.slot],h=l.filter(t=>t.schicht==='hinten').sort((a,b)=>o(a)-o(b)),m=l.filter(t=>t.schicht==='mitte').sort((a,b)=>o(a)-o(b)),v=l.filter(t=>t.schicht==='vorne').sort((a,b)=>o(a)-o(b));return[...h,...m,...v]}
async function zeichne(){
 document.querySelectorAll('#slots select').forEach(s=>{if(wahl[s.dataset.s]!==undefined)s.value=wahl[s.dataset.s]});
 const teile=reihe();await Promise.all(teile.map(t=>{const i=bild(t);return i.complete?1:new Promise(r=>i.onload=r)}));
 const c=$('gross').getContext('2d');const [bx0,by0,bx1,by1]=D().box.map(v=>v/2),sw=Math.max(bx1-bx0,by1-by0)*1.1,sx=(bx0+bx1)/2-sw/2,sy=(by0+by1)/2-sw/2;
 c.fillStyle='#fff';c.fillRect(0,0,1024,1024);teile.forEach(t=>c.drawImage(bild(t),sx,sy,sw,sw,0,0,1024,1024));
 pixel();
 const h=Object.entries(herkunft);$('herk').innerHTML=h.length?h.map(([s,w])=>`${SLOTS.find(x=>x[0]===s)[1]}: <b>${w}</b>`).join(' · '):'';
}
function pixel(){const teile=reihe(),W=114,H=116,k=1024/2048;
 const t=document.createElement('canvas');t.width=t.height=1024;const c=t.getContext('2d');teile.forEach(x=>c.drawImage(bild(x),0,0));
 const px=c.getImageData(0,0,1024,1024).data,[x0,y0,x1,y1]=D().box.map(v=>v*k);const w=x1-x0+1,h=y1-y0+1,cell=Math.max(h/(H-2),w/(W-2));
 const ox=x0-(W*cell-w)/2,oy=y1+1-H*cell+cell,out=$('pix').getContext('2d'),im=out.createImageData(W,H);
 for(let cy=0;cy<H;cy++)for(let cx=0;cx<W;cx++){const a0=Math.floor(ox+cx*cell),a1=Math.max(Math.floor(ox+(cx+1)*cell),Math.floor(ox+cx*cell)+1),b0=Math.floor(oy+cy*cell),b1=Math.max(Math.floor(oy+(cy+1)*cell),Math.floor(oy+cy*cell)+1);
  let tot=(a1-a0)*(b1-b0),op=0,dark=0,sum=0;for(let y=Math.max(b0,0);y<Math.min(b1,1024);y++)for(let x=Math.max(a0,0);x<Math.min(a1,1024);x++){const i=(y*1024+x)*4;if(px[i+3]<128)continue;op++;if(px[i]<=70)dark++;else sum+=px[i]}
  const j=(cy*W+cx)*4;if(op*2<tot)continue;let v;if(dark*100>=tot*30)v=51;else if(op-dark>0)v=Math.min(255,Math.round(sum/(op-dark)/17)*17);else v=51;im.data[j]=im.data[j+1]=im.data[j+2]=v;im.data[j+3]=255}
 out.putImageData(im,0,0)}
