<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamagotchi · Kreuzungsvorschau</title>
  <style>
    body { margin: 24px auto; padding: 0 16px; max-width: 900px; background: #f2f1ee; color: #252525; font: 16px system-ui, sans-serif; }
    h1 { font-size: 1.7rem; }
    .controls { display: flex; align-items: end; flex-wrap: wrap; gap: 14px; margin: 24px 0; }
    label { display: grid; gap: 4px; }
    select, button { font: inherit; padding: 6px 10px; }
    #cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; background: white; padding: 12px 6px; }
    .age, .row-title { text-align: center; font-size: .9rem; font-weight: 600; }
    .row-title { grid-column: 1 / -1; background: #f2f1ee; padding: 5px; }
    canvas { width: 100%; max-width: 144px; height: auto; image-rendering: pixelated; justify-self: center; }
    #status { min-height: 1.5em; }
  </style>
  <script defer src="ohren.js"></script>
  <script defer src="vorschau.js"></script>
</head>
<body>
  <h1>Kreuzungsvorschau</h1>
  <div class="controls">
    <label>Grundform <select id="body" disabled></select></label>
    <label>Ohren <select id="ears" disabled></select></label>
    <button id="random" type="button" disabled>Andere Kreuzung zeigen</button>
  </div>
  <div id="cards" aria-label="Original und Kreuzung in vier Altersstufen"></div>
  <p id="status" role="status">Grafiken werden geladen …</p>
</body>
</html>
